name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Check the tag matches gradle.properties
        run: |
          v=$(grep '^version=' gradle.properties | cut -d= -f2)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, version $v"; exit 1; }
      - run: ./gradlew build
      - name: Collect the jars
        run: |
          mkdir dist
          cp adapters/paper/build/libs/Seasons-*.jar web/build/libs/SeasonsWeb-*.jar dist/
          cd dist && sha256sum *.jar > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
      # The same jars go to Hangar and Modrinth below.
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: dist/

  # Hangar and Modrinth each get the Seasons jar attached to the GitHub Release, from their own job,
  # so either can be re-run alone. A tag with a hyphen is a beta on both (docs/adr/0006). Seasons
  # Web is listed from M7, once it does something.
  hangar:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.ref_name }}
          path: dist
      - name: Publish to Hangar
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: ./gradlew :adapters:paper:publishAllPublicationsToHangar -PreleaseJar="$(ls dist/Seasons-*.jar)"

  modrinth:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.ref_name }}
          path: dist
      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew :adapters:paper:modrinth -PreleaseJar="$(ls dist/Seasons-*.jar)"
