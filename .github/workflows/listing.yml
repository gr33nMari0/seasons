name: listing
# Keeps the store pages in line with docs/listing/ and docs/images/: Hangar's main page, and
# Modrinth's fields, description, icon and gallery. Hangar's API takes only pages, so its icon,
# summary, keywords and links are set on the website (CONTRIBUTING.md, "Store pages").
on:
  push:
    branches: [main]
    paths: ['docs/listing/**', 'docs/images/**', '.github/scripts/modrinth-listing.sh']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: listing
jobs:
  hangar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Sync the main page to Hangar
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: ./gradlew :adapters:paper:syncAllPagesToHangar

  modrinth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sync the project page to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: .github/scripts/modrinth-listing.sh "$(grep '^modrinthProject=' gradle.properties | cut -d= -f2)"
