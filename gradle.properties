version=1.0.0-SNAPSHOT
# Minecraft versions the scenario suite runs against, oldest first (see Platform: support policy)
minecraftVersions=26.3
# The newest Paper API, which CI also compiles against (deprecations are errors in every build), so
# removals show up before they land. The oldest supported one is paper in libs.versions.toml.
paperApiNewest=26.3.build.+
org.gradle.caching=true
org.gradle.parallel=true
# Where tagged releases are published (release.yml, docs/adr/0006): the Hangar project's slug
# (hangar.papermc.io/gr33nMari0/SeasonsMC, with Release and Beta channels) and the Modrinth
# project's slug (modrinth.com/project/seasonsmc).
hangarProject=SeasonsMC
modrinthProject=seasonsmc
