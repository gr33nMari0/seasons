# Every dependency and plugin version, pinned. Dependabot proposes updates.
[versions]
# The oldest supported drop; the build number stays dynamic within it, as Paper advises.
paper = "26.3.build.+"
configurate = "4.2.0"
bstats = "3.2.1"
bluemap = "2.8.2"
slf4j = "2.0.20"
jspecify = "1.0.1"
errorprone = "2.52.0"
nullaway = "0.14.4"
junit = "6.1.3"
assertj = "3.27.7"
mockbukkit = "4.120.0"
# The Paper build MockBukkit was made against (Paper-Version in its manifest); tests run on it.
paper-mockbukkit = "26.3.build.249-stable"
# Test servers only: lets the Mineflayer bots, which trail the newest drop, join (docs/adr/0001).
viaversion = "5.12.2"
viabackwards = "5.12.2"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
bstats-bukkit = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }
bluemap-api = { module = "de.bluecolored:bluemap-api", version.ref = "bluemap" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
paper-api-mockbukkit = { module = "io.papermc.paper:paper-api", version.ref = "paper-mockbukkit" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.3", version.ref = "mockbukkit" }

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
run-paper = { id = "xyz.jpenilla.run-paper", version = "3.1.0" }
spotless = { id = "com.diffplug.spotless", version = "8.11.0" }
errorprone = { id = "net.ltgt.errorprone", version = "5.2.0" }
