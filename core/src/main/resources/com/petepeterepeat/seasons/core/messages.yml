# Every player-facing string in Seasons, as MiniMessage (https://docs.papermc.io/adventure/minimessage/).
# Placeholders such as <version> are filled in as plain text. Edit freely, then /season reload.
# Discord posts use the same text with the formatting tags left out.
schema-version: 1

time:
  day: "<n> day"
  days: "<n> days"
  hour: "<n> hour"
  hours: "<n> hours"
  minute: "<n> minute"
  minutes: "<n> minutes"
  second: "<n> second"
  seconds: "<n> seconds"

phase:
  active-frontier: "Active, Frontier stage"
  active-open: "Active, Open stage"
  ending-countdown: "Ending, countdown running"
  ending-archiving: "Ending, archiving players"
  intermission: "Intermission"

season:
  none: "<red>No season recorded yet. Run /season init with the number of the season in progress first.</red>"
  unreadable: "<red>season.json can't be read, so season commands are refused. See the server log, fix or restore the file, then restart.</red>"
  save-failed: "<red>Seasons couldn't save season.json: <error></red>"

status:
  header: "<gold>Seasons <version></gold> <gray>on <platform></gray>"
  no-season: "<gray>No season recorded yet. Run /season init to record the season in progress.</gray>"
  season: "<gray>Season</gray> <white><season></white>"
  phase: "<gray>Phase:</gray> <white><phase></white>"
  planned-end: "<gray>Planned end:</gray> <white><time></white> <gray>(<utc>)</gray>"
  no-planned-end: "<gray>No planned end set. /season schedule end sets one.</gray>"
  countdown: "<gray>Countdown:</gray> <white><time></white> <gray>left</gray>"
  interrupted: "<yellow>The end countdown was interrupted by a restart at <time>. Run /season end to start it again.</yellow>"
  journal: "<gray>Journal: <entries> entries, last <sequence>, <pending> waiting for recovery</gray>"
  journal-damaged: "<yellow>Journal: <count> damaged lines were dropped at startup; a copy of the original is beside journal.log</yellow>"
  journal-error: "<red>Journal: the last write failed: <error></red>"
  journal-unavailable: "<red>Journal: unavailable (<error>). Nothing that moves items can run.</red>"
  config-problem: "<red>Config problem at startup, so the bundled defaults are in use:</red> <problem>"
  unreadable: "<red>season.json can't be read: <error></red>"
  capabilities-ok: "<green>The <platform> adapter supports everything Seasons uses.</green>"
  capability-gap: "<yellow>Not available on <platform>: <capability></yellow>"
  players: "<gray>Players: <archived> archived into Season <season>, <waiting> still to archive at login</gray>"
  furthest: "<gray>Furthest block from 0,0 this season: <distance> blocks, by <name> at <x>, <z></gray>"
  no-furthest: "<gray>No block placed yet this season.</gray>"
  recovery-failed: "<red>Recovery of <name>'s Season <season> archive stopped: <reason>. Fix it, then run /season reprocess <name>.</red>"

info:
  season: "<gray>Season</gray> <white><season></white>"
  phase: "<gray>Phase:</gray> <white><phase></white>"
  planned-end: "<gray>Planned end:</gray> <white><time></white> <gray>(<utc>)</gray>"
  no-planned-end: "<gray>No planned end yet.</gray>"
  no-cell: "<gray>Your cell: none yet</gray>"
  no-season: "<gray>No season is recorded yet.</gray>"

init:
  done: "<green>Recorded Season <season> as the season in progress.</green>"
  refused: "<red>Season <season> is already recorded. /season init only works on a server that has never run Seasons.</red>"
  invalid: "<red>Season numbers start at 1.</red>"

schedule:
  done: "<green>Season <season> now ends at <time> (<utc>).</green> <gray>Reminders count down to it; the season ends when an admin runs /season end.</gray>"
  done-auto: "<green>Season <season> now ends at <time> (<utc>).</green> <gray>Reminders count down to it, and the countdown starts by itself then (schedule.autoEnd).</gray>"
  soon: "<yellow>That is less than a week away.</yellow>"
  past: "<red>That time has already passed.</red>"
  invalid-time: "<red><error></red>"
  refused: "<red>The planned end can only be set while Season <season> is Active.</red>"

reminder: "<gold>Season <season> ends in <when>, at <time>.</gold>"

end:
  started: "<gold>Season <season> ends in <when>.</gold> <yellow>Finish what you're doing!</yellow>"
  bar: "<gold>Season <season> ends in <time></gold>"
  now: "<gold>Ending Season <season> now: archiving <count> online players.</gold>"
  cancelled: "<green>The end of Season <season> was cancelled. Play on!</green>"
  intermission: "<gold>Season <season> has ended. Welcome to the Intermission.</gold>"
  interrupted: "<yellow>The server restarted during the end countdown of Season <season>, so it was cancelled. Run /season end to start it again.</yellow>"
  archiving-failed: "<red>Archiving for Season <season> stopped: <error>. See the server log.</red>"
  not-saved: "<red>Season <season> wasn't ended: season.json couldn't be saved, so nobody was archived. Fix the problem in the server log, restart, then run /season end again.</red>"
  already-ending: "<red>Season <season> is already ending. /season cancel stops the countdown.</red>"
  already-ended: "<red>Season <season> has already ended. /season launch starts the next one.</red>"
  not-counting: "<red>No countdown is running.</red>"
  not-archiving: "<red>Season <season> isn't archiving.</red>"
  unknown-flag: "<red>Unknown option <flag>. /season end takes --dry-run and --now.</red>"
  dry-run:
    header: "<gold>Dry run of /season end for Season <season>. Nothing changes.</gold>"
    countdown: "<gray>A <when> countdown would start, then every online player would be archived.</gray>"
    now: "<gray>No countdown (--now): every online player would be archived at once.</gray>"
    players: "<gray>Online players to archive (<count>):</gray> <white><names></white>"
    no-players: "<gray>Nobody is online to archive; players catch up when they next log in.</gray>"
    next: "<gray>Then Season <season> would move to the Intermission.</gray>"
    refused: "<red>/season end would be refused:</red> <reason>"

cancel:
  too-late: "<red>Archiving has started and can't be cancelled.</red>"
  nothing: "<red>There is no countdown to cancel.</red>"

launch:
  refused: "<red>Season <season> can only be launched from the Intermission.</red>"
  no-spawn: "<red>Set Season <next>'s spawn first: stand there and run /season spawn set.</red>"
  bad-dimension: "<red>Season <next>'s spawn is in a dimension this server doesn't have. Set it again with /season spawn set.</red>"
  busy: "<red>Someone is being archived or unarchived right now. Try again in a moment.</red>"
  not-archived: "<red>Someone online isn't archived into Season <season> yet, or has a crash waiting for recovery. See /season status, then /season archive or /season reprocess them.</red>"
  unknown-flag: "<red>Unknown option <flag>. /season launch takes --dry-run.</red>"
  failed: "<red>Launching Season <season> stopped: <error>. See the server log; it is finished at the next restart.</red>"
  loading: "<gray>Loading the spawn at <x>, <y>, <z>...</gray>"
  done: "<gold>Season <season> has begun!</gold>"
  title: "<gold>Season <season></gold>"
  subtitle: "<yellow>has begun!</yellow>"
  deaths: "Deaths, Season <season>"
  dry-run:
    header: "<gold>Dry run of /season launch for Season <season>. Nothing changes.</gold>"
    players: "<gray><count> online players would go to <x>, <y>, <z> in <dimension>, in survival.</gray>"
    refused: "<red>/season launch would be refused:</red> <reason>"

spawn:
  set: "<green>Season <season>'s spawn is now <x>, <y>, <z> in <dimension>.</green>"
  player-only: "<red>Stand where the spawn should be and run this in game.</red>"
  failed: "<red>The spawn wasn't saved: <error>. See the server log.</red>"

archive:
  done: "<gold>Your Season <season> is archived in the Hall of Fame.</gold>"
  archived: "<green>Archived <name> into Season <season>.</green>"
  nothing: "<gray><name> has no finished season waiting to be archived.</gray>"
  offline: "<red><name> isn't online. Players are archived when they next log in.</red>"
  busy: "<red><name> is being archived or unarchived right now.</red>"
  failed: "<red>Archiving <name> into Season <season> stopped: <reason>. Their items stay on them; /season reprocess <name> tries again.</red>"
  unavailable: "<red>The journal is unavailable, so nobody can be archived. See /season status.</red>"
  no-cells: "<yellow>Season <season> has no Hall cells yet, so archived players stay where they are.</yellow>"
  recovery-mismatch: "<red><name>'s inventory neither matches their Season <season> archive nor is empty, so recovery stopped. Nothing was cleared. Check it, then run /season reprocess <name>.</red>"

unarchive:
  done: "<green>Restored <name>'s Season <season> archive to them.</green>"
  done-displaced: "<green>Restored <name>'s Season <season> archive to them.</green> <gray><count> items that were in the way are kept in <file>.</gray>"
  offline: "<red><name> isn't online. Unarchiving needs them in game.</red>"
  no-archive: "<red><name> has no archive for Season <season>.</red>"
  not-empty: "<red><name>'s inventory isn't empty. Empty it, or add --force to keep what they carry in a displaced-items file.</red>"
  unknown-flag: "<red>Unknown option <flag>. /season unarchive takes --force.</red>"
  failed: "<red>Unarchiving <name>'s Season <season> archive stopped: <reason>. It finishes at their next login.</red>"

reprocess:
  nothing: "<gray><name> has nothing pending.</gray>"
  offline: "<yellow><name> has <count> operation(s) pending, which finish when they log in.</yellow>"
  done: "<green>Finished <count> pending operation(s) for <name>.</green>"
  failed: "<red><name> still has <count> operation(s) pending: <reason></red>"

view:
  title: "<name> · Season <season>"
  page: "<gray>Page <page> of <pages></gray>"
  previous: "<yellow>Previous page</yellow>"
  next: "<yellow>Next page</yellow>"

homecoming:
  refused: "<red>Homecoming only happens once, in the Frontier stage.</red>"

config:
  reloaded: "<green>Reloaded config.yml, messages.yml, secrets.yml and the season files.</green>"
  reload-failed: "<red>Reload failed. The previous config stays live.</red>"
  reload-failed-by: "<red><name> ran /season reload and it failed. The previous config stays live.</red>"
  reload-error: "<red>Reload failed: <error>. See the server log.</red>"
  console-name: "The console"
  valid: "<green>All config files are valid.</green>"
  invalid: "<red>Some config files have problems. Nothing was changed.</red>"
  warning: "<yellow><warning></yellow>"
  problem-line: "<red><file>, line <line>, column <column>:</red> <message>"
  problem-path: "<red><file>, at <path>:</red> <message>"
  problem-file: "<red><file>:</red> <message>"
