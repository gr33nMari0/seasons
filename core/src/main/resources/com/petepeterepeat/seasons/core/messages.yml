    no-touch: "<red>You can't change anything in the Hall of Fame.</red>"
    no-join: "<red>A double chest can't reach across a cell's edge or the Hall's.</red>"
    keeps: "<red>Your cell keeps what's in it now: nothing comes out of it.</red>"
  nothing-archived: "<gray>Nothing is archived here yet.</gray>"
  figure-name: "<name> · Season <season>"
  plaque: "<name> · Season <season><newline>Advancements: <completed> / <visible><newline><gray>Right-click below for the season card</gray>"
  plaque-imported: "<name> · Season <season><newline>Season <season> · imported<newline><gray>Right-click below for the season card</gray>"
  no-free-cell: "<yellow>No free Hall of Fame cell is left in Season <season>'s galleries for <name>; they are archived without displays.</yellow>"
  player-only: "<red>Run this in game.</red>"
  no-permission: "<red>You don't have permission to visit the Hall of Fame.</red>"
  no-gallery: "<red>There is no gallery <gallery>.</red>"
  no-cell: "<red>There is no cell <cell>.</red>"
  ambiguous-cell: "<red>More than one gallery has a cell <cell>; name it as gallery:cell.</red>"
