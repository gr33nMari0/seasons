# Every player-facing string in Seasons, as MiniMessage (https://docs.papermc.io/adventure/minimessage/).
# Placeholders such as <version> are filled in as plain text. Edit freely, then /season reload.
# Discord posts use the same text with the formatting tags left out.
schema-version: 1

time:
  day: "<n> day"
  days: "<n> days"
  hour: "<n> hour"
  hours: "<n> hours"
  minute: "<n> minute"
  minutes: "<n> minutes"
  second: "<n> second"
  seconds: "<n> seconds"

phase:
  active-frontier: "Active, Frontier stage"
  active-open: "Active, Open stage"
  ending-countdown: "Ending, countdown running"
  ending-archiving: "Ending, archiving players"
  intermission: "Intermission"

position:
  bad: "<red>Give a position as x y z: numbers, ~ for relative (~ ~1 ~-3), ^ ^ ^ along your facing, or here.</red>"
  console: "<red>The console has no position: give x y z as numbers.</red>"
  box: "<red>Give a box as two positions (x y z x y z, ~ for relative), or sel for the wand selection.</red>"

season:
  none: "<red>No season recorded yet. Run /season init with the number of the season in progress first.</red>"
  unreadable: "<red>season.json can't be read, so season commands are refused. See the server log, fix or restore the file, then restart.</red>"
  save-failed: "<red>Seasons couldn't save season.json: <error></red>"

status:
  header: "<gold>Seasons <version></gold> <gray>on <platform></gray>"
  no-season: "<gray>No season recorded yet. Run /season init to record the season in progress.</gray>"
  season: "<gray>Season</gray> <white><season></white>"
  phase: "<gray>Phase:</gray> <white><phase></white>"
  planned-end: "<gray>Planned end:</gray> <white><time></white> <gray>(<utc>)</gray>"
  no-planned-end: "<gray>No planned end set. /season schedule end sets one.</gray>"
  countdown: "<gray>Countdown:</gray> <white><time></white> <gray>left</gray>"
  interrupted: "<yellow>The end countdown was interrupted by a restart at <time>. Run /season end to start it again.</yellow>"
  journal: "<gray>Journal: <entries> entries, last <sequence>, <pending> waiting for recovery</gray>"
  journal-damaged: "<yellow>Journal: <count> damaged lines were dropped at startup; a copy of the original is beside journal.log</yellow>"
  journal-error: "<red>Journal: the last write failed: <error></red>"
  journal-unavailable: "<red>Journal: unavailable (<error>). Nothing that moves items can run.</red>"
  config-problem: "<red>Config problem at startup, so the bundled defaults are in use:</red> <problem>"
  unreadable: "<red>season.json can't be read: <error></red>"
  capabilities-ok: "<green>The <platform> adapter supports everything Seasons uses.</green>"
  capability-gap: "<yellow>Not available on <platform>: <capability></yellow>"
  map-none: "<gray>BlueMap isn't installed, so no map markers are published.</gray>"
  map-waiting: "<yellow>BlueMap is installed but hasn't started yet; the map markers go up once it has.</yellow>"
  map-published: "<gray>BlueMap: <markers> markers on <maps> maps.</gray>"
  players: "<gray>Players: <archived> archived into Season <season>, <waiting> still to archive at login</gray>"
  pets: "<gray>Pets: <count> waiting to travel</gray>"
  furthest: "<gray>Furthest block from 0,0 this season: <distance> blocks, by <name> at <x>, <z></gray>"
  no-furthest: "<gray>No block placed yet this season.</gray>"
  recovery-failed: "<red>Recovery of <name>'s Season <season> archive stopped: <reason>. Fix it, then run /season reprocess <name>.</red>"
  gallery-left-out: "<red>Gallery <gallery> couldn't be loaded at startup, so it is left out, and /season end and /season launch are refused until it is fixed and /season reload succeeds:</red> <problem>"
  markers-left-out: "<red>markers.yml couldn't be loaded at startup, so it is left out and no shared waypoints are shown until it is fixed and /season reload succeeds:</red> <problem>"
  hall-left-out: "<red>hall.yml couldn't be loaded at startup, so the Hall has no hub, spawn or links, and /season end and /season launch are refused until it is fixed and /season reload succeeds:</red> <problem>"

info:
  season: "<gray>Season</gray> <white><season></white>"
  phase: "<gray>Phase:</gray> <white><phase></white>"
  planned-end: "<gray>Planned end:</gray> <white><time></white> <gray>(<utc>)</gray>"
  no-planned-end: "<gray>No planned end yet.</gray>"
  no-cell: "<gray>Your cell: none yet</gray>"
  cell: "<gray>Your cell:</gray> <white><cell></white> <gray>in</gray> <white><gallery></white>"
  no-season: "<gray>No season is recorded yet.</gray>"
  idle: "<gray>Seasons is idle until an admin runs</gray> <white>/season init <usage></white><gray>.</gray>"
  archived: "<gray>Archived into Season <season>.</gray>"
  archive-waiting: "<gray>Waiting to be archived into Season <season>.</gray>"

init:
  done: "<green>Recorded Season <season> as the season in progress.</green>"
  refused: "<red>Season <season> is already recorded. /season init only works on a server that has never run Seasons.</red>"
  invalid: "<red>Season numbers start at 1.</red>"

schedule:
  done: "<green>Season <season> now ends at <time> (<utc>).</green> <gray>Reminders count down to it; the season ends when an admin runs /season end.</gray>"
  done-auto: "<green>Season <season> now ends at <time> (<utc>).</green> <gray>Reminders count down to it, and the countdown starts by itself then (schedule.autoEnd).</gray>"
  soon: "<yellow>That is less than a week away.</yellow>"
  past: "<red>That time has already passed.</red>"
  invalid-time: "<red><error></red>"
  refused: "<red>The planned end can only be set while Season <season> is Active.</red>"
  cleared: "<green>Season <season> has no planned end now.</green>"

reset:
  operators-only: "<red>Only a server operator can reset Seasons.</red>"
  usage: "<red>Use /season reset, or /season reset --keep-hall to keep the hub, galleries and cells.</red>"
  ending: "<red>Seasons can't be reset while a season is ending; /season cancel first, or wait for the Intermission.</red>"
  busy: "<red>Seasons can't be reset while someone is being archived, or an import, stamp or curation is unfinished.</red>"
  warning: "<red><bold>This deletes Seasons from this world:</bold> every archive and the items in it, every player record, every season, gallery and hub file, the vaults, the museum and the recycle bin. Archived items can't be given back afterwards.</red>"
  counts: "<yellow>That is <players> player records, <archives> archives, <vaults> vaults, <museum> museum items and <recycled> recycled items.</yellow>"
  keeps-hall: "<yellow>--keep-hall keeps the hub, the galleries and their cells, without owners.</yellow>"
  keeps-nothing: "<yellow>Nothing is kept; add --keep-hall to keep the hub, galleries and cells.</yellow>"
  next-confirm: "<gold>A backup is written first. Run /season reset confirm within a minute to go on.</gold>"
  not-started: "<red>No reset is waiting; run /season reset first.</red>"
  last-warning: "<red><bold>Last warning:</bold> this can't be undone in game; only the backup brings it back.</red>"
  type-delete: "<gold>Please type DELETE in chat to reset Seasons, or anything else to stop.</gold>"
  console-word: "<gold>From the console, run /season reset confirm DELETE to reset Seasons.</gold>"
  cancelled: "<green>Reset cancelled; nothing was deleted.</green>"
  backup-failed: "<red>The backup couldn't be written (<error>), so nothing was reset.</red>"
  backed-up: "<gray>Backed up to plugins/Seasons/reset-backups/<file>.</gray>"
  not-journalled: "<red>The reset couldn't be written to the journal (<error>), so nothing was reset.</red>"
  stopped-by: "<red><name> reset Seasons, which has stopped. The next start is a fresh install.</red>"
  delete-failed: "<red>Some files couldn't be deleted (<error>); the backup has them all.</red>"
  done: "<green>Seasons was reset and has stopped. Restart the server to start again as a fresh install.</green>"

records:
  ahead: "<yellow><name>'s record says they were archived through Season <through>, beyond Season <season> on record, so archiving would skip them. Was season.json reset by hand? /season reset starts over.</yellow>"

players:
  line: "<gray><name>: <played>; <status>; <cell></gray>"
  played-one: "played Season <seasons>"
  played: "played Seasons <seasons>"
  none-played: "played no season yet"
  archived: "archived into Season <season>"
  pending: "not archived yet"
  not-played: "didn't play Season <season>"
  cell: "cell <cell>"
  no-cell: "no cell"
  none: "<gray>No such players.</gray>"
  which: "<red>List online, archived or pending players, or all of them.</red>"

seasons:
  line: "<gray>Season <season><record>: <spawn>; <galleries>; <archived> archived.</gray>"
  on-record: " (on record, <phase>)"
  spawn: "spawn <at>"
  no-spawn: "no spawn"
  galleries: "galleries <galleries>"
  no-galleries: "no galleries"

reminder: "<gold>Season <season> ends in <when>, at <time>.</gold>"

end:
  started: "<gold>Season <season> ends in <when>.</gold> <yellow>Finish what you're doing!</yellow>"
  bar: "<gold>Season <season> ends in <time></gold>"
  now: "<gold>Ending Season <season> now: archiving <count> online players.</gold>"
  cancelled: "<green>The end of Season <season> was cancelled. Play on!</green>"
  intermission: "<gold>Season <season> has ended. Welcome to the Intermission.</gold>"
  discord: "Season <season> has ended. Welcome to the Intermission!"
  interrupted: "<yellow>The server restarted during the end countdown of Season <season>, so it was cancelled. Run /season end to start it again.</yellow>"
  archiving-failed: "<red>Archiving for Season <season> stopped: <error>. See the server log.</red>"
  not-saved: "<red>Season <season> wasn't ended: season.json couldn't be saved, so nobody was archived. Fix the problem in the server log, restart, then run /season end again.</red>"
  galleries-left-out: "<red>Season <season> can't end while a gallery file failed to load: its players would be archived without cells. Fix it and run /season reload; /season status shows the problem.</red>"
  already-ending: "<red>Season <season> is already ending. /season cancel stops the countdown.</red>"
  already-ended: "<red>Season <season> has already ended. /season launch starts the next one.</red>"
  not-counting: "<red>No countdown is running.</red>"
  not-archiving: "<red>Season <season> isn't archiving.</red>"
  unknown-flag: "<red>Unknown option <flag>. /season end takes --dry-run and --now.</red>"
  dry-run:
    header: "<gold>Dry run of /season end for Season <season>. Nothing changes.</gold>"
    countdown: "<gray>A <when> countdown would start, then every online player would be archived.</gray>"
    now: "<gray>No countdown (--now): every online player would be archived at once.</gray>"
    players: "<gray>Online players to archive (<count>):</gray> <white><names></white>"
    no-players: "<gray>Nobody is online to archive; players catch up when they next log in.</gray>"
    next: "<gray>Then Season <season> would move to the Intermission.</gray>"
    spawn-in-zone: "<red>Season <next>'s spawn at <x>, <y>, <z> is inside zone <zone>. /season launch is refused until it moves.</red>"
    spawn-in-hall: "<red>Season <next>'s spawn at <x>, <y>, <z> is inside the Hall of Fame. /season launch is refused until it moves.</red>"
    spawn-far: "<yellow>Season <next>'s spawn at <x>, <y>, <z> is <distance> blocks from 0, 0, beyond 24,000: strongholds may be out of reach.</yellow>"
    refused: "<red>/season end would be refused:</red> <reason>"
    no-egg-plinth: "<yellow>Museum: no egg plinth for Season <season>, so its dragon egg won't be shown. Add egg: <season> to a trophy anchor in a museum gallery.</yellow>"

cancel:
  too-late: "<red>Archiving has started and can't be cancelled.</red>"
  nothing: "<red>There is no countdown to cancel.</red>"

launch:
  refused: "<red>Season <season> can only be launched from the Intermission.</red>"
  galleries-left-out: "<red>Season <next> can't launch while a gallery file failed to load. Fix it and run /season reload; /season status shows the problem.</red>"
  no-spawn: "<red>Set Season <next>'s spawn first: stand there and run /season spawn set.</red>"
  bad-dimension: "<red>Season <next>'s spawn is in a dimension this server doesn't have. Set it again with /season spawn set.</red>"
  busy: "<red>Someone is being archived or unarchived right now. Try again in a moment.</red>"
  spawn-in-zone: "<red>Season <next>'s spawn is inside a zone. Move the spawn or the zone first; /season end --dry-run says which.</red>"
  spawn-in-hall: "<red>Season <next>'s spawn is inside the Hall of Fame. Move it first with /season spawn set.</red>"
  not-archived: "<red>Someone online isn't archived into Season <season> yet, or has a crash waiting for recovery. See /season status, then /season archive or /season reprocess them.</red>"
  unknown-flag: "<red>Unknown option <flag>. /season launch takes --dry-run.</red>"
  failed: "<red>Launching Season <season> stopped: <error>. See the server log; it is finished at the next restart.</red>"
  loading: "<gray>Loading the spawn at <x>, <y>, <z>...</gray>"
  done: "<gold>Season <season> has begun!</gold>"
  discord: "Season <season> has begun!"
  title: "<gold>Season <season></gold>"
  subtitle: "<yellow>has begun!</yellow>"
  deaths: "Deaths, Season <season>"
  dry-run:
    header: "<gold>Dry run of /season launch for Season <season>. Nothing changes.</gold>"
    players: "<gray><count> online players would go to <x>, <y>, <z> in <dimension>, in survival.</gray>"
    refused: "<red>/season launch would be refused:</red> <reason>"

spawn:
  set: "<green>Season <season>'s spawn is now <x>, <y>, <z> in <dimension>.</green>"
  set-candidate: "<green>Season <season>'s spawn is now candidate <name>: <x>, <y>, <z> in <dimension>.</green>"
  player-only: "<red>Stand where the spawn should be and run this in game, or name a spawn candidate.</red>"
  failed: "<red>The spawn wasn't saved: <error>. See the server log.</red>"
  far: "<yellow>That's <distance> blocks from 0, 0, beyond 24,000: strongholds may be out of reach.</yellow>"
  in-hall: "<red>Season <season>'s spawn can't be inside the Hall of Fame.</red>"
  show: "<gray>Season <season>'s spawn: <x>, <y>, <z> in <dimension>, <distance> blocks from 0, 0.</gray>"
  show-none: "<gray>Season <season> has no spawn yet. /season spawn set sets one.</gray>"
  recorded: "<green>Season <season>'s spawn is recorded at <x>, <y>, <z> in <dimension>.</green>"
  record-not-past: "<red>Season <season> isn't over yet: only a past season's spawn is recorded. /season spawn set sets the next season's.</red>"
  cleared: "<green>Season <season> has no spawn now; /season launch waits for one.</green>"
  candidate:
    added: "<green>Added spawn candidate <name> for Season <season> at <x>, <y>, <z> in <dimension>.</green>"
    removed: "<green>Removed spawn candidate <name> from Season <season>.</green>"
    exists: "<red>Season <season> already has a spawn candidate called <name>.</red>"
    unknown: "<red>Season <season> has no spawn candidate called <name>.</red>"
    bad-name: "<red>Candidate names start with a letter, then lower-case letters, digits and dashes, up to 32, such as north-mesa; not at or here.</red>"
    moved: "<green>Moved spawn candidate <name> of Season <season> to <x>, <y>, <z> in <dimension>.</green>"
    player-only: "<red>Stand where the candidate is and run this in game.</red>"
    inside: "<red>Season <season>'s spawn candidates can't be inside zone <zone>; every candidate must stay outside every zone.</red>"
    in-hall: "<red>Season <season>'s spawn candidates can't be inside the Hall of Fame.</red>"
    none: "<gray>Season <season> has no spawn candidates yet. Stand at one and run /season spawn candidate add with its name.</gray>"
    header: "<gold>Season <season>'s spawn candidates:</gold>"
    line: "<gray>- <name>: <x>, <y>, <z> in <dimension>, <distance> blocks from 0, 0<notes></gray>"
    the-spawn: " (the spawn)"
    beyond: " (beyond 24,000)"
    failed: "<red>The spawn candidate wasn't saved: <error>. See the server log.</red>"

archive:
  done: "<gold>Your Season <season> is archived in the Hall of Fame.</gold>"
  archived: "<green>Archived <name> into Season <season>.</green>"
  nothing: "<gray><name> has no finished season waiting to be archived.</gray>"
  offline: "<red><name> isn't online. Players are archived when they next log in.</red>"
  busy: "<red><name> is being archived or unarchived right now.</red>"
  failed: "<red>Archiving <name> into Season <season> stopped: <reason>. Nothing was cleared and the attempt was put back; they are held while Seasons tries again every few seconds, or run /season archive <name>.</red>"
  busy-pending: "<yellow><name> was busy when Season <season>'s archive reached them, so they are held and archived as soon as they are free.</yellow>"
  held: "<yellow>Seasons couldn't archive you just now and tries again in a moment. Until then nothing you carry can move.</yellow>"
  stuck: "<red><name> still isn't archived into Season <season> after <count> tries, and stays held. See the server log, then /season archive <name>, or /season reprocess <name> --restart if recovery is stuck.</red>"
  unavailable: "<red>The journal is unavailable, so nobody can be archived. See /season status.</red>"
  no-cells: "<yellow>Season <season> has no free Hall cells left, so some archived players stay where they are.</yellow>"
  recovery-uncleared: "<red><name>'s inventory is empty, but Seasons never cleared it for their Season <season> archive, so recovery stopped: what was copied may be somewhere else. Check it, then run /season reprocess <name>.</red>"
  hold-command: "<red>Seasons is moving your items right now, so commands wait a moment.</red>"
  recovery-mismatch: "<red><name>'s inventory neither matches their Season <season> archive nor is empty, so recovery stopped. Nothing was cleared. Check it, then run /season reprocess <name>.</red>"

unarchive:
  done: "<green>Restored <name>'s Season <season> archive to them.</green>"
  done-displaced: "<green>Restored <name>'s Season <season> archive to them.</green> <gray><count> items that were in the way are kept in <file>.</gray>"
  offline: "<red><name> isn't online. Unarchiving needs them in game.</red>"
  no-archive: "<red><name> has no archive for Season <season>.</red>"
  not-empty: "<red><name>'s inventory isn't empty. Empty it, or add --force to keep what they carry in a displaced-items file.</red>"
  unknown-flag: "<red>Unknown option <flag>. /season unarchive takes --force.</red>"
  imported: "<red><name>'s Season <season> archive was imported from a hand-built cell, so it can't be unarchived. /hof import undo puts its items back in the cell.</red>"
  failed: "<red>Unarchiving <name>'s Season <season> archive stopped: <reason>. It finishes at their next login.</red>"

reprocess:
  nothing: "<gray><name> has nothing pending.</gray>"
  offline: "<yellow><name> has <count> operation(s) pending, which finish when they log in.</yellow>"
  done: "<green>Finished <count> pending operation(s) for <name>.</green>"
  failed: "<red><name> still has <count> operation(s) pending: <reason></red>"
  restarted: "<green>Put back <name>'s stuck archive for Season <seasons>; archiving them again from what they carry now.</green>"
  restart-empty: "<red><name> carries nothing, so their stuck archive can't be restarted: what it copied would be lost. Check the server log and the archive files first.</red>"
  unknown-flag: "<red>Unknown option <flag>. /season reprocess takes --restart.</red>"

view:
  title: "<name> · Season <season>"
  page: "<gray>Page <page> of <pages></gray>"
  previous: "<yellow>Previous page</yellow>"
  next: "<yellow>Next page</yellow>"

decorate:
  opened: "<green>The decorating window for Season <season> is open: <count> players have cells.</green>"
  opened-one: "<green>The decorating window for Season <season> is open: 1 player has cells.</green>"
  already-open: "<red>The decorating window for Season <season> is already open.</red>"
  closed: "<green>The decorating window for Season <season> is closed.</green>"
  not-open: "<red>The decorating window for Season <season> isn't open.</red>"
  refused: "<red>The decorating window only opens while Season <season> is being played.</red>"
  after-archive: "<gold>You have <when> to arrange your cell before it locks.</gold>"
  locked: "<yellow>Your cell is locked.</yellow>"

hof:
  plaque-awards: "<gold><awards></gold>"
  award-separator: " · "
  locked: "<gold>The Season <season> galleries are locked.</gold>"
  assigned: "<gold>Your Hall of Fame cell for Season <season> is <cell> in <gallery>.</gold>"
  no-build: "<red>You can't build here.</red>"
