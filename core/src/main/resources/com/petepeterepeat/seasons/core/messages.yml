# Next steps after setup steps (questions 268): entries split by |; a command is clickable and only
# offered to whoever may run it. admin.hints: false in config.yml turns them off.
next:
  season:
    init: "/season spawn set | /hof hall hub"
    end: "/season spawn candidate list | /season spawn set | /season launch --dry-run"
    spawn:
      set: "/season launch --dry-run"
    launch:
      dry-run: "/season launch"
  hof:
    hall:
      hub: "/hof hall spawn"
      spawn: "/hof gallery create | /hof link add"
    gallery:
      create: "/hof gallery bounds <gallery> | /hof gallery entry <gallery>"
      bounds: "/hof cell row <gallery> | /hof cell new <gallery>"
    cell:
      new: "select the cell's corners with the wand | /hof cell bounds <cell> | /hof cell anchor <cell> figure"
      row: "/hof hall check | /hof cell list <gallery>"
