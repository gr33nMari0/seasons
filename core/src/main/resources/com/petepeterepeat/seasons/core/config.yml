# Seasons settings. Every key and its default is listed here; edit, then /season reload.
# Durations are written like 7d, 1h30m, 10m or 10s. Reference: docs/spec.md, Configuration.
schema-version: 1

schedule:
  # false: the season ends only when an admin runs /season end, whatever the planned end says.
  # true: the end countdown starts by itself at the planned end (or 5 minutes after the next
  # start, if the server was down then).
  autoEnd: false
  # How long before the planned end each reminder goes out, in chat and on Discord.
  reminders: [7d, 1d, 1h, 10m]
  # The boss-bar countdown /season end starts. /season end --now skips it.
  endCountdown: 10m

launch:
  # The next season starts only with /season launch or the launch button in the Hall.
  requireManual: true
  # true: launch moves the world spawn to the new season's spawn. false: it stays where it is,
  # such as at the Hall spawn, so first-time joiners and bedless respawns arrive in the hub.
  setWorldSpawn: true

archive:
  # Where archiving sends everyone at season end: cell (their own cell) or hub (the Hall spawn).
  arrival: cell

# What archiving resets for the new season.
resets:
  xp: reset                      # reset, keep
  enderChest: vault              # vault, archive, keep
  respawnPoint: clear            # clear, keep
  effects: clear                 # clear, keep
  advancements: archive-and-reset   # archive-and-reset, keep
  recipes: keep                  # keep, reset

cells:
  assignment: random             # random, claim, ordered, manual
  # Play time a player needs in the season to get a cell.
  minPlaytime: 0
  access: open                   # open, bounds, gate
  # Containers owners may place in their cell during decorating; view-only after the lock.
  containers: [chest, barrel, shulker_box, decorated_pot]
  # With access: gate, what a cell's gate plane is while it is shut; air while it is open.
  gateBlock: iron_bars
  # open: a gate is open unless an admin (/hof cell gate, /hof gallery gate) or its owner
  # (/hof gate) shut it. auto: shut whenever its cell is locked, open while its owner decorates.
  gates: open
  # false: nobody is ever moved out of a cell; a shutting gate waits until the cell is empty, and a
  # bounds cell only refuses entry at its edge. true: they are moved to the gallery's entry.
  moveOut: false

decorating:
  # The decorating window opens this long before the planned end (or with /season decorate open).
  opensBefore: 7d
  lockAtEnd: true
  # Time owners get to arrange their cell once archived; then it locks. 0 turns it off.
  afterArchive: 15m

pets:
  enabled: true
  # 0 to 10.
  maxPerPlayer: 5

firsts:
  # Items whose first pickup each season is a season first.
  rareItems: [heavy_core, totem_of_undying, trident, nether_star]

hof:
  # Where /hof works from: within bedDistance (0 to 16) of any bed (anyBed: false means only their
  # own respawn bed; requireBed: false drops the bed check), no monsters near, no damage in the
  # last noDamageFor, on the ground (not riding, gliding, falling or swimming), not in lava, fire or
  # powder snow. cooldown is the least time between visits, rateLimit between attempts. Holders of
  # seasons.hof.anywhere (ops by default) skip every check but rateLimit.
  entry: { requireBed: true, bedDistance: 3, anyBed: true, noHostiles: true, noDamageFor: 10s, onGround: true, noHazards: true, cooldown: 0s, rateLimit: 5s }
  # Where /hof leave puts a player when their saved spot is unsafe, in order.
  returnSafety: { hostileRadius: 8, fallbacks: [bed, nearby, spawn] }
  # Damage immunity after every Seasons teleport.
  arrivalImmunity: 5s
  # What leaving the Hall by walking, falling or another plugin's teleport does. intermission: just
  # leave, except during the Intermission, when everyone goes back to the Hall spawn. always: back to
  # where they came from. never: just leave.
  sealed: intermission
  # /hof leave with no saved spot (after a respawn or a first join in the hub): season-spawn takes
  # them to the season's spawn, refuse refuses.
  leaveWithoutSpot: season-spawn
  # returnToLink: /hof leave after a link to the Hall goes back to that link.
  links: { returnToLink: true }
  # Players in creative mode build anywhere in the Hall, as holders of seasons.hof.bypass do.
  creativeBuilds: true

zones:
  # Also post announce-mode entries ("Peter entered the market") to the Discord webhook.
  announceToDiscord: false
  # Draw a locked `outside` circle zone as a world border each player inside it sees: the square
  # around the circle. Visual only: the zone does the locking, and the world's own border is never
  # changed. Players in the Hall, in another dimension or holding seasons.zone.bypass see none.
  frontierBorder: false

dragon:
  newEggEachSeason: true
  eggTo: slayer                  # slayer, portal

deaths:
  # Where each season's deaths objective (seasons_deaths_s3) is shown: list (the tab list),
  # sidebar, below_name or none. A new objective is made at each launch; earlier ones are kept.
  display: list

# Curation (/hof curate): every action, museum, return, take or destroy, is audited, posted to the
# admin webhook and told to the owner. With requireReason the curator types the reason in chat,
# which nobody else sees; without it, "no reason given" is recorded.
curate:
  requireReason: true

# The Hall admins' wand (/hof wand): this item, marked as Seasons' own, so a plain one does nothing.
wand:
  item: blaze_rod

# Admin conveniences. hints: after a setup step, suggest the commands that usually come next.
admin:
  hints: true

# Awards, worked out when the season ends and announced at the Intermission. Each winner gets a
# trophy (item) on a free trophy anchor in their cell; ties share the award, and an award whose
# best is 0 goes to nobody. measure is one of deaths, travelled, play-time, diamonds, dragon,
# furthest-builder (from the season spawn), advancements, or any General-tab statistic id such as
# minecraft:jump; off turns an award off. A new id adds an award, named in messages.yml under
# awards.names, or after its id.
awards:
  most-deaths: { measure: deaths, item: skeleton_skull }
  furthest-travelled: { measure: travelled, item: compass }
  most-dedicated: { measure: play-time, item: clock }
  deepest-pockets: { measure: diamonds, item: diamond }
  dragon-slayer: { measure: dragon, item: dragon_head }
  furthest-builder: { measure: furthest-builder, item: spyglass }
  most-advancements: { measure: advancements, item: knowledge_book }
