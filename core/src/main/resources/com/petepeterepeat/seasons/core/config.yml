# Seasons settings. Every key and its default is listed here; edit, then /season reload. Durations
# are written like 7d, 1h30m, 10m or 10s. A server's file only needs the keys it changes. Reference:
# docs/config.md, generated with this file from the code.
schema-version: 1

# When the season ends and how players are reminded.
schedule:
  # false: the season ends only when an admin runs /season end, whatever the planned end says. true:
  # the end countdown starts by itself at the planned end (or 5 minutes after the next start, if the
  # server was down then).
  autoEnd: false
  # How long before the planned end each reminder goes out, in chat and on Discord.
  reminders: [7d, 1d, 1h, 10m]
  # The boss-bar countdown /season end starts. /season end --now skips it.
  endCountdown: 10m

# Launching the next season.
launch:
  # The next season starts only with /season launch or the launch button in the Hall.
  requireManual: true
  # true: launch moves the world spawn to the new season's spawn. false: it stays where it is, such
  # as at the Hall spawn, so first-time joiners and bedless respawns arrive in the hub.
  setWorldSpawn: true

# Archiving at season end.
archive:
  # Where archiving sends everyone at season end: cell (their own cell) or hub (the Hall spawn). One
  # of `cell`, `hub`.
  arrival: cell

# What archiving resets for the new season.
resets:
  # Experience: reset to zero, or kept. One of `reset`, `keep`.
  xp: reset
  # The ender chest: vault (moved to the player's ender vault, which they can take from), archive
  # (archived with the rest of their gear) or keep. One of `vault`, `archive`, `keep`.
  enderChest: vault
  # The bed or anchor a player respawns at: cleared, or kept. One of `clear`, `keep`.
  respawnPoint: clear
  # Potion effects: cleared, or kept. One of `clear`, `keep`.
  effects: clear
  # Advancements: archived (the plaque shows the count) and reset, or kept. Recipe unlocks are never
  # archived. One of `archive-and-reset`, `keep`.
  advancements: archive-and-reset
  # Recipe unlocks: kept, or reset. One of `keep`, `reset`.
  recipes: keep

# Hall of Fame cells: who gets one, and how visitors get in.
cells:
  # How cells are given out when the decorating window opens: random (a random free cell each),
  # claim (players pick one with /hof claim), ordered (the free cells in the order they were tagged)
  # or manual (admins assign with /hof cell assign). One of `random`, `claim`, `ordered`, `manual`.
  assignment: random
  # Play time a player needs in the season to get a cell.
  minPlaytime: 0
  # How visitors get into a cell: open (walk in), bounds (refused at its edge while locked) or gate
  # (a gate fills the doorway). One of `open`, `bounds`, `gate`.
  access: open
  # Containers owners may place in their cell during decorating; view-only after the lock.
  containers: [chest, barrel, shulker_box, decorated_pot]
  # With access: gate, what a cell's gate plane is while it is shut; air while it is open.
  gateBlock: iron_bars
  # open: a gate is open unless an admin (/hof cell gate, /hof gallery gate) or its owner (/hof
  # gate) shut it. auto: shut whenever its cell is locked, open while its owner decorates. One of
  # `open`, `auto`.
  gates: open
  # false: nobody is ever moved out of a cell; a shutting gate waits until the cell is empty, and a
  # bounds cell only refuses entry at its edge. true: they are moved to the gallery's entry.
  moveOut: false

# The decorating window, when owners arrange their cells.
decorating:
  # The decorating window opens this long before the planned end (or with /season decorate open).
  opensBefore: 7d
  # Owners stop decorating once their cell locks: afterArchive after their archive, or at launch if
  # that is sooner.
  lockAtEnd: true
  # Time owners get to arrange their cell once archived; then it locks. 0 turns it off.
  afterArchive: 15m

# Pets that travel with their owner to the new spawn at launch (/pet add).
pets:
  # Whether players can register pets with /pet add to travel with them at launch.
  enabled: true
  # How many pets each player may register, 0 to 10.
  maxPerPlayer: 5

# Season firsts: the first player each season to do or find something.
firsts:
  # Items whose first pickup each season is a season first.
  rareItems: [heavy_core, totem_of_undying, trident, nether_star]

# Visiting the Hall of Fame with /hof.
hof:
  # Where and when /hof works. Holders of seasons.hof.anywhere (ops by default) skip every check but
  # rateLimit.
  entry:
    # Whether /hof needs a bed near at all.
    requireBed: true
    # How near a bed a player must stand, 0 to 16 blocks.
    bedDistance: 3
    # true: any bed of any kind. false: only their own respawn bed.
    anyBed: true
    # Refused with monsters near, as the game refuses sleep.
    noHostiles: true
    # Refused for this long after taking damage.
    noDamageFor: 10s
    # Refused while riding, gliding, falling or swimming.
    onGround: true
    # Refused in lava, fire or powder snow, or while burning.
    noHazards: true
    # The least time between visits.
    cooldown: 0s
    # The least time between attempts.
    rateLimit: 5s
  # Where /hof leave puts a player when their saved spot is unsafe.
  returnSafety:
    # A saved spot with monsters within this many blocks is unsafe.
    hostileRadius: 8
    # Where to go instead, in order: bed (their respawn bed), nearby (the nearest safe block) or
    # spawn (the season's spawn).
    fallbacks: [bed, nearby, spawn]
  # Damage immunity after every Seasons teleport.
  arrivalImmunity: 5s
  # What leaving the Hall by walking, falling or another plugin's teleport does. intermission: just
  # leave, except during the Intermission, when everyone goes back to the Hall spawn. always: back
  # to where they came from. never: just leave. One of `intermission`, `always`, `never`.
  sealed: intermission
  # /hof leave with no saved spot (after a respawn or a first join in the hub): season-spawn takes
  # them to the season's spawn, refuse refuses. One of `season-spawn`, `refuse`.
  leaveWithoutSpot: season-spawn
  # Links between the Hall and each season's spawn.
  links:
    # /hof leave after a link to the Hall goes back to that link.
    returnToLink: true
  # Players in creative mode build anywhere in the Hall, as holders of seasons.hof.bypass do.
  creativeBuilds: true

# Hall links (/hof link): blocks, areas and floating text that take players to the Hall, a season's
# spawn, a named point or another link. The links themselves live in links.yml.
links:
  # After arriving by a link or /hof, step and area triggers wait this long. The trigger a player
  # lands in never fires until they leave it, so 0s (off) is usually enough.
  arrivalGrace: 0s
  # Who may take a new link, by where it leads: everyone, op, or permission (seasons.link.use.<id>).
  # /hof link access changes one link.
  access:
    # Links to the Hall spawn.
    hall: everyone
    # Links to a season's spawn.
    seasonSpawn: everyone
    # Every other link.
    other: op
  # Copying 1.1's links from hall.yml into links.yml, once, at the first start.
  upgrade:
    # Which copied block links keep firing when stood on: non-interactive (plates and plain blocks;
    # buttons, signs and doors become click-only), plates-only, or all.
    keepStepping: non-interactive
  # The link editor: sneak-right-click a trigger as a link admin.
  editor:
    # Sneak-right-clicking a trigger opens the editor for link admins.
    sneakClick: true
    # dialog, or menu for a chest menu with typed answers.
    ui: dialog
  # The sign /hof link item gives.
  item:
    # The item given: a sign of any wood.
    material: oak_sign
    # Its name, MiniMessage.
    name: "<gold>Hall of Fame sign</gold>"
    # The four lines written on it when placed, MiniMessage.
    lines: ["", "<gold><bold>Hall of Fame</bold></gold>", "<gray>right-click</gray>", ""]
    # Whether the lines glow.
    glowing: true
  # Floating text triggers' defaults.
  text:
    # Text size, 0.25 to 4.
    scale: 1.0
    # center turns to face each viewer, vertical turns about the up axis, fixed doesn't.
    billboard: center
    # Background colour, #AARRGGBB.
    background: "#40000000"
    # A shadow under the letters.
    shadow: true
    # Lit at full brightness, so it shows at night.
    fullBright: true
  # /hof link send <targets> <link> from command blocks.
  commandBlocks:
    # Command blocks may run /hof link send.
    enabled: true
    # Which checks /hof link send applies by default: none (only locked land and the Intermission),
    # entry (the link's access and /hof's checks but the bed), or full.
    checks: entry
    # Only players are moved; other entities a selector picks are left.
    playersOnly: true
  # The MiniMessage tags sign and floating text may use; every other tag, click and hover included,
  # is stripped.
  styleTags: [color, gradient, rainbow, decorations, reset, shadow_color]

# Zones over the old world. The zones themselves live in each season's file and are drawn with
# /season zone.
zones:
  # Also post announce-mode entries ("Peter entered the market") to the Discord webhook.
  announceToDiscord: false
  # Draw a locked `outside` circle zone as a world border each player inside it sees: the square
  # around the circle. Visual only: the zone does the locking, and the world's own border is never
  # changed. Players in the Hall, in another dimension or holding seasons.zone.bypass see none.
  frontierBorder: false

# The ender dragon and its egg.
dragon:
  # Launch clears the End's previously-killed flag, so each season's first dragon kill drops a new
  # egg.
  newEggEachSeason: true
  # Where that egg goes: slayer (to the player who killed the dragon, with a fanfare, or to their
  # vault's Returned page if they can't take it) or portal (it stays on the exit portal, as in the
  # game). One of `slayer`, `portal`.
  eggTo: slayer

# The deaths display.
deaths:
  # Where each season's deaths objective (seasons_deaths_s3) is shown: list (the tab list), sidebar,
  # below_name or none. A new objective is made at each launch; earlier ones are kept.
  display: list

# Curation (/hof curate): every action, museum, return, take or destroy, is audited, posted to the
# admin webhook and told to the owner.
curate:
  # The curator types a reason in chat for each action, which nobody else sees; without it, "no
  # reason given" is recorded.
  requireReason: true

# The Hall admins' wand (/hof wand).
wand:
  # The item /hof wand gives, marked as Seasons' own, so a plain one does nothing.
  item: blaze_rod
  # The Hall's parts outlined for an admin alone while they hold the wand, or after /hof show on.
  outlines:
    # How far away a box is still drawn, in blocks.
    range: 48
    # How many boxes at most, nearest first.
    max: 64
  # Moving a face of a box with the wand: sneak and scroll moves the face looked at by a step; drop
  # (Q) cycles the steps.
  nudge:
    # The steps drop (Q) cycles through, in blocks.
    steps: [1, 10]
    # Swap-hands (F) applies an edited box, as /hof sel apply does.
    swapHandsApplies: true
  # Anchors drawn and moved with the wand.
  anchors:
    # Every anchor gets a coloured marker and a label while the wand is held.
    markers: true
    # How near, in blocks, an anchor's label is shown.
    labelRange: 12
    # How long a picked-up anchor waits without a move before it goes back.
    holdTimeout: 60s
    # Swap-hands while holding an archive or plaque anchor carries its block too, when the block is
    # empty.
    carryBlocks: true

# Admin conveniences.
admin:
  # After a setup step, suggest the commands that usually come next.
  hints: true

# What Seasons writes to the server log.
logging:
  # At startup, write a few lines saying what Seasons found: the season, the Hall, the journal,
  # Discord and BlueMap, and whether setup needs attention.
  startupSummary: true
  # Extra lines for chasing a problem, per area: hall, archive, zones, discord, maps or commands.
  # Leave empty normally; they can be many.
  debug: []

# What Seasons API offers other plugins, such as Seasons Web's dashboard: snapshots of who's online,
# refreshed on the server thread.
api:
  # How often who's online (dimension, area, AFK) is refreshed, besides at every join and leave.
  refresh: 30s
  # How long a player may be idle before they show as AFK.
  afkAfter: 5m

# Awards, worked out when the season ends and announced at the Intermission. Each winner gets a
# trophy (item) on a free trophy anchor in their cell; ties share the award, and an award whose best
# is 0 goes to nobody. measure is one of deaths, travelled, play-time, diamonds, dragon,
# furthest-builder (from the season spawn), advancements, or any General-tab statistic id such as
# minecraft:jump; off turns an award off. A new id adds an award, named in messages.yml under
# awards.names, or after its id.
awards:
  most-deaths: { measure: deaths, item: skeleton_skull }
  furthest-travelled: { measure: travelled, item: compass }
  most-dedicated: { measure: play-time, item: clock }
  deepest-pockets: { measure: diamonds, item: diamond }
  dragon-slayer: { measure: dragon, item: dragon_head }
  furthest-builder: { measure: furthest-builder, item: spyglass }
  most-advancements: { measure: advancements, item: knowledge_book }
