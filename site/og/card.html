<!-- A page's 1200 × 630 preview card, screenshotted by scripts/og.mjs. Filled from the query:
     title, section, description, art. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/design/fonts.css">
<link rel="stylesheet" href="/design/tokens.css">
<link rel="stylesheet" href="/og/card.css">
<script type="module" src="/og/card.mjs"></script>
</head>
<body>
<main class="card">
  <div class="top">
    <img class="logo" src="/design/art/logo.svg" alt="" width="64" height="58">
    <span class="brand">Seasons</span>
    <span class="section" data-section></span>
  </div>
  <div class="body">
    <div class="text">
      <h1 data-title></h1>
      <p data-description></p>
    </div>
    <img class="art" data-art alt="" width="240" height="240">
  </div>
  <div class="foot"><span>seasonsmc.petepeterepeat.com</span><span class="tag">Paper plugin · Minecraft</span></div>
  <div class="ground"></div>
</main>
</body>
</html>
