# Seasons Web: every line players see. MiniMessage format; <name> and the like are filled in as
# plain text.
schema-version: 1
off: "<red>The Seasons dashboard is off on this server."
link:
  usage: "<gray>Show a code on the dashboard, then type /web link with it."
  linked: "<green>Linked: this device is now logged in as <player>."
  invalid: "<red>That code isn't valid or has expired. Show a new code on the dashboard."
  locked: "<red>Too many wrong codes. Try again in a minute."
sessions:
  none: "<gray>You have no logged-in devices."
  header: "<gold>Your logged-in devices (<count>):"
  line: "<gray><id> · <device> · last seen <seen>"
  hint: "<gray>/web logout and an id ends one; /web logout all ends them all."
logout:
  one: "<green>Logged out of <device>."
  all: "<green>Logged out of <count> <devices>."
  unknown: "<red>You have no device <id>. /web sessions lists them."
  choose: "<gray>You have <count> logged-in devices: /web logout and an id from /web sessions, or /web logout all."
privacy:
  hidden: "<gold>You're now hidden from the dashboard's leaderboards. /web privacy shows you again."
  shown: "<green>You're now shown on the dashboard's leaderboards."
  failed: "<red>Couldn't change that: <reason>"
